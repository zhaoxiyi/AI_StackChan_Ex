; =============================================================================
; CoreS3 I2S 全双工最小验证工程 (独立于主固件, 不参与主工程构建)
;
; 背景:
;   CoreS3 的麦克风 (ES7210, din=14) 与扬声器 (AW88298, dout=13) 共享
;   同一组 I2S 时钟线 (BCK=34, WS=33) — 硬件就是一路全双工 I2S 拓扑。
;   M5Unified 0.2.15 把 Mic/Speaker 实现为两次独立的 I2S 驱动安装
;   (同端口互斥, 第二次 install 失败), 因此无法共存。
;
;   本验证绕过 M5Unified 的 Mic/Speaker 类, 用 IDF 4.4 老 API 的全双工
;   模式 (MASTER | TX | RX 单实例, 一个驱动同时收发) 同时录音+播放。
;
; 验证目标:
;   1. 全双工单实例 I2S 安装成功
;   2. ES7210 录音 / AW88298 回放 (I2C 寄存器序列对齐 M5Unified)
;   3. 边播边录: 回放期间麦克风持续采集 (全双工核心)
;
; 烧录:  cd firmware/test_duplex && pio run -t upload
; 监视:  pio device monitor  (115200)
; =============================================================================

[env:m5stack-cores3-duplex-test]
platform = espressif32@6.3.2
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = my_cores3_16MB.csv
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_CORES3
lib_deps =
    ; M5Unified 使用本地 vendored 版 (lib/M5Unified, 已 patch CoreS3 duplex RX)
    ; M5GFX 经 libextra/ 软链复用主工程 libdeps (避免旧 M5Unified 冲突)
lib_extra_dirs =
    libextra
