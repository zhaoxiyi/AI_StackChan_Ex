# =============================================================================
# StackChan Server Configuration
# 全双工 AI 对话上位机服务配置
# =============================================================================

server:
  host: "0.0.0.0"
  port: 8080
  # WebSocket endpoint that mimics OpenAI Realtime API
  ws_path: "/v1/realtime"
  # Health check endpoint
  health_path: "/health"

# ---------------------------------------------------------------------------
# Model Routing Configuration (模型路由)
# ---------------------------------------------------------------------------
routing:
  # Default model for general conversation
  default_model: "vllm"
  # Models available for routing
  models:
    vllm:
      enabled: true
      description: "Local vLLM model for daily conversation"
      # vLLM OpenAI-compatible endpoint
      base_url: "http://192.168.31.147:8000/v1"
      api_key: "not-needed"
      # model_name: "minicpm-o"            # vLLM 注册名 (实际: MiniCPM-o-2_6-int4, 窗口 2048)
      model_name: "qwen3-8b"
      max_tokens: 2048              # 用于普通模型
      # max_tokens: 384              # 用于omni模型，内存不够的情况，窗口仅 2048 → 回复上限 384 (语音回复 1-3 句足够, 留足输入空间)
      temperature: 0.7
    deepseek:
      enabled: true
      description: "DeepSeek cloud API for complex tasks"
      base_url: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"
      model_name: "deepseek-chat"
      max_tokens: 4096
      temperature: 0.7
      # Billing monitoring
      billing:
        # Two-level threshold for balance alerts
        balance_warning_threshold: 10.0    # CNY - warn user
        balance_critical_threshold: 2.0    # CNY - force fallback to vLLM
        check_interval_minutes: 60

# ---------------------------------------------------------------------------
# Speech-to-Text Configuration (语音识别)
# ---------------------------------------------------------------------------
stt:
  # Engine: sensevoice | cpu_stt | faster_whisper | openai_whisper
  #   sensevoice: 阿里 SenseVoice，ModelScope 下载，中/粤/日/英/韩 自动检测 (推荐)
  #   cpu_stt: faster-whisper 纯 CPU 版，HuggingFace/ModelScope 下载
  #   faster_whisper: GPU 加速版本
  engine: "sensevoice"
  sensevoice:
    # 模型源: huggingface(官方发布, 推荐) | modelscope(社区) | local(本地路径)
    model_source: "huggingface"
    # modelscope 源的模型 ID (社区模型 ITN 后处理可能崩溃, 不推荐)
    model_name: "danieldong/sensevoice-small-onnx-quant"
    use_int8: true               # 仅 modelscope 源有效: True=model.int8.onnx
    num_threads: 4               # onnxruntime 线程数
    use_itn: true                # 逆文本归一化 (数字/日期自动转写)
    silence_break_ms: 1200       # 静音断句阈值 (阶段性停顿才触发识别)
    max_audio_ms: 15000          # 音频最长累积
  cpu_stt:
    model_size: "small"              # tiny, base, small, medium
    device: "auto"                   # auto, cpu, cuda
    compute_type: "auto"             # auto, float16, int8
    language: null                   # null=自动检测, zh, ja, en
    beam_size: 5
    use_vad: true
    model_source: "huggingface"      # huggingface, modelscope, local
    model_name: ""                   # ModelScope 模型 ID 或 local 路径
    silence_break_ms: 800            # 静音断句阈值 (毫秒)
    max_audio_ms: 15000              # 音频最长累积 (毫秒)
  faster_whisper:
    model_size: "small"              # tiny, base, small, medium, large-v3
    device: "cuda"                   # cuda or cpu
    compute_type: "float16"          # float16, int8_float16, int8
    language: "zh"                   # ja, zh, en, auto
    beam_size: 5
    vad_filter: true
    vad_threshold: 0.5
    min_silence_duration_ms: 500
  # Alternative: OpenAI Whisper API
  openai_whisper:
    enabled: false
    api_key: "${OPENAI_API_KEY}"
    model: "whisper-1"
    language: "zh"
  # Audio format from StackChan firmware
  audio:
    input_sample_rate: 16000          # Actual firmware recording rate
    input_channels: 1
    input_sample_width: 2             # 16-bit PCM
    chunk_samples: 2000               # ~125ms per chunk
    output_sample_rate: 24000         # Playback rate expected by firmware

# ---------------------------------------------------------------------------
# Text-to-Speech Configuration (语音合成)
# ---------------------------------------------------------------------------
tts:
  # Engine: cpu_tts | openai_tts | voicevox
  #   cpu_tts: 纯 CPU 可运行，基于 edge-tts (需联网) (推荐开发环境)
  #   openai_tts: OpenAI 云端 TTS
  engine: "cpu_tts"
  cpu_tts:
    voice: "zh-CN-XiaoxiaoNeural"   # edge-tts 语音角色 (中文优化)
    rate: "+0%"                     # 语速 -20% ~ +20%
    pitch: "+0Hz"                   # 音调 -20Hz ~ +20Hz
  openai_tts:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "tts-1"
    voice: "alloy"                   # alloy, echo, fable, onyx, nova, shimmer
    response_format: "pcm"           # pcm for raw audio
    speed: 1.0
  # Alternative: VOICEVOX (Japanese)
  voicevox:
    enabled: false
    base_url: "http://localhost:50021"
    speaker: 3                        # 3 = Zundamon
  # Alternative: Edge TTS (free, good quality)
  edge_tts:
    enabled: false
    voice: "ja-JP-NanamiNeural"       # Japanese voice
  audio:
    sample_rate: 24000                # Must match firmware expectation

# ---------------------------------------------------------------------------
# Conversation Configuration (对话配置)
# ---------------------------------------------------------------------------
conversation:
  # System prompt for the AI assistant
  system_prompt: |
    你是 Stack-chan，一个友好的桌面机器人助手，通过语音和主人对话。
    必须遵守：
    1. 始终使用简体中文回复（硬性要求，不得使用日语或英语单词）
    2. 回复简短自然，通常 1-3 句话，像日常对话一样
    3. 语气温暖、友好、略带俏皮

    注意：你的回复会被语音合成播出，所以只说普通话，不要夹杂其他语言。
  
  # Turn detection
  turn:
    silence_timeout_ms: 2000          # Stop listening after 2s silence
    max_recording_ms: 30000           # Max recording duration (matches firmware)
    min_speech_ms: 200                # Minimum speech duration to trigger
  
  # Interruption
  interruption:
    enabled: true
    # How to handle when user interrupts during response
    strategy: "immediate_stop"        # immediate_stop | fade_out
    # 全双工语音打断: SPEAKING 期间检测用户语音 (固件 AEC 后音频)
    speech_rms_threshold: 400         # RMS 阈值 (16bit PCM, 室内语音典型 300-2000)
    speech_confirm_blocks: 3          # 连续超阈值块数 (~125ms/块) 去抖 | queue
  
  # Conversation history
  history:
    max_messages: 20                  # Keep last N messages in context
    enable_summary: true              # Summarize old messages
    summary_trigger_count: 15         # Trigger summary after N messages
    summary_model: "vllm"             # Use local model for summarization
    # Context 字符预算: 发给 LLM 的历史消息总字符数上限 (降低 vLLM 压力)
    max_context_chars: 4000           # 用于普通模型 (qwen3-8b 8192 tokens 建议 4000-5000), 0=不限制
    # max_context_chars: 1200         # 用于 omni 模型 (MiniCPM-o 窗口仅 2048 → 预算 1200)
    # STT 文本精简: 抛弃重复内容与口语填充词, 保留语义后入 Context
    enable_condense: true
    # 被字符预算挤出的旧消息 → 摘要保留的字符预算 (不硬丢弃旧上下文)
    summary_budget_chars: 350
    # 用户更正记录上限 (保持后续对话正确方向)
    corrections_max: 5

  # 语句评估: 断句识别的文本是否完整、是否提交 LLM
  utterance:
    min_chars: 2                      # 最短有效文本 (低于此长度视为噪声)
    submit_punctuation: "。！？!?.;…"  # 句末标点 = 语句完整 → 立即提交
    submit_min_chars_no_punct: 15     # 无标点时累积多少字才提交
    max_pending_chars: 100            # 累积上限, 强制提交

# ---------------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                        # DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {extra[session_id]: <12} | {message}"
  file:
    enabled: true
    path: "logs/stackchan_server.log"
    rotation: "100 MB"
    retention: "7 days"
  # Enable per-session trace logging
  session_tracing: true
